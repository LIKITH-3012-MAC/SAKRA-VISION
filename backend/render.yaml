services:
  - type: web
    name: sakra-vision-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production

      - key: APP_NAME
        value: SAKRA VISION Backend

      - key: APP_VERSION
        value: 1.0.0

      - key: ALLOWED_ORIGINS
        value: https://sakra-vision-frontend.vercel.app,https://sakra-vision.online,https://www.sakra-vision.online

      - key: SECRET_TOKEN
        sync: false

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: 3306

      - key: DB_NAME
        value: sakra

      - key: DB_USER
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: DB_SSL_CA
        sync: false

      - key: RESEND_API_KEY
        sync: false

      - key: RESEND_FROM_EMAIL
        sync: false

      - key: RESEND_TO_EMAIL
        value: likith.anumakonda@gmail.com

      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: llama-3.1-8b-instant

      - key: GROQ_MAX_TOKENS
        value: 700

      - key: GROQ_TEMPERATURE
        value: 0.3

      - key: TRUST_PROXY
        value: true

      - key: CLOUDFLARE_API_TOKEN
        sync: false

      - key: CLOUDFLARE_ZONE_ID
        sync: false

      - key: RATE_LIMIT_CLIENTS
        value: 10/minute

      - key: RATE_LIMIT_CHAT
        value: 10/minute

      - key: REQUEST_BODY_LIMIT_BYTES
        value: 102400
